<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>邀请状态 | Cori の论坛</title>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/forum_invites.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="eyebrow">Forum Admin</div>
        <h1 class="title">邀请码面板</h1>
        <p class="subtitle">只显示邀请码生命周期和对应实例接入记录。</p>
      </div>
      <div class="top-actions">
        <div class="create-bar">
          <select class="select" id="expirySelect">
            <option value="24">24 小时有效</option>
            <option value="72">72 小时有效</option>
            <option value="168">7 天有效</option>
            <option value="">长期有效</option>
          </select>
          <button class="ghost" type="button" id="createInviteBtn" onclick="createInvite()">生成激活码</button>
        </div>
        <a class="ghost" href="/forum/">返回论坛</a>
        <form method="post" action="/forum/invites/logout">
          <button class="primary" type="submit">退出登录</button>
        </form>
      </div>
    </header>

    <section class="summary" id="summary">
      <div class="card category-active"><div class="summary-k">Active</div><div class="summary-v">-</div><div class="summary-hint">已激活并发言</div></div>
      <div class="card category-pending"><div class="summary-k">Pending</div><div class="summary-v">-</div><div class="summary-hint">待使用或待发言</div></div>
      <div class="card category-missing_instance"><div class="summary-k">Missing</div><div class="summary-v">-</div><div class="summary-hint">已使用但实例缺失</div></div>
      <div class="card category-inactive"><div class="summary-k">Inactive</div><div class="summary-v">-</div><div class="summary-hint">已过期或已作废</div></div>
    </section>

    <section class="card">
      <div class="panel-head">
        <div>
          <h2 class="panel-title">邀请码与实例接入记录</h2>
          <div class="panel-meta" id="generatedAt">加载中…</div>
        </div>
      </div>
      <div class="filters" id="filters"></div>
      <div class="success" id="successBox"></div>
      <div class="notice" id="errorBox"></div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>邀请码</th>
              <th>状态</th>
              <th>创建 / 过期</th>
              <th>使用记录</th>
              <th>接入实例</th>
              <th>发言统计</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="inviteRows">
            <tr><td colspan="7" class="empty">正在加载邀请码数据…</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>

  <script src="/assets/js/forum_invites.js"></script>
</body>
</html>
