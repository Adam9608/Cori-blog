<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cori</title>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700;900&family=DM+Mono:wght@400;500&family=Pacifico&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --ice-50: #f0f7ff; --ice-200: #b9dcff; --ice-400: #3a9eff; --ice-500: #0d7ff5; --ice-600: #0060cc;
      --violet-300: #c4b5fd; --violet-500: #8b5cf6;
      --text-primary: #0f172a; --text-secondary: #475569; --text-muted: #94a3b8;
      --surface: rgba(255,255,255,0.72); --border: rgba(148,163,184,0.2);
      --font: 'Zen Kaku Gothic New', -apple-system, sans-serif;
      --mono: 'DM Mono', ui-monospace, monospace;
    }
    html, body {
      width: 100%; min-height: 100vh;
      font-family: var(--font); color: var(--text-primary);
      background: #f8faff;
      background-image:
        radial-gradient(ellipse 80% 60% at 0% 0%,   rgba(186,224,255,0.45) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 100% 0%,  rgba(196,181,253,0.3)  0%, transparent 55%),
        radial-gradient(ellipse 70% 60% at 50% 100%, rgba(147,197,253,0.25) 0%, transparent 60%);
      background-attachment: fixed;
      overflow-x: hidden;
    }

    .stars { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
    .star {
      position: absolute; height: 1.5px; width: 200px;
      background: linear-gradient(90deg, transparent, rgba(147,197,253,0.8) 60%, rgba(196,181,253,0.9));
      border-radius: 999px; opacity: 0;
      transform: rotate(35deg) translateX(-300px);
      animation: shoot 8s linear infinite;
    }
    .star:nth-child(1) { top:  5%; left: 15%; animation-delay: 0s;   animation-duration: 7s; }
    .star:nth-child(2) { top: 20%; left: 55%; animation-delay: 2.5s; animation-duration: 9s; }
    .star:nth-child(3) { top: -2%; left: 75%; animation-delay: 5s;   animation-duration: 6s; }
    .star:nth-child(4) { top: 40%; left:  5%; animation-delay: 1.2s; animation-duration: 10s; }
    .star:nth-child(5) { top: 60%; left: 40%; animation-delay: 3.8s; animation-duration: 8s; }
    @keyframes shoot {
      0%   { opacity: 0; transform: rotate(35deg) translateX(-300px); }
      8%   { opacity: .8; } 85% { opacity: .6; }
      100% { opacity: 0; transform: rotate(35deg) translateX(200vw); }
    }

    .stage {
      position: relative; z-index: 1;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; padding: 60px 24px;
    }

    .avatar-wrap { position: relative; margin-bottom: 28px; }
    .avatar {
      width: 110px; height: 110px; border-radius: 50%;
      border: 3px solid rgba(147,197,253,0.6);
      box-shadow: 0 0 0 6px rgba(147,197,253,0.12), 0 0 40px rgba(59,130,246,0.15);
      transition: transform 0.6s ease, box-shadow 0.6s ease;
      display: block;
    }
    .avatar:hover {
      transform: scale(1.04);
      box-shadow: 0 0 0 8px rgba(147,197,253,0.2), 0 0 60px rgba(59,130,246,0.25);
    }
    .avatar-ring {
      position: absolute; inset: -8px; border-radius: 50%;
      border: 1px solid rgba(147,197,253,0.3);
      animation: pulse-ring 3s ease-in-out infinite;
    }
    @keyframes pulse-ring {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50%       { transform: scale(1.05); opacity: 0.2; }
    }

    .name {
      font-family: 'Pacifico', cursive;
      font-size: clamp(52px, 10vw, 80px);
      background: linear-gradient(135deg, var(--ice-400) 0%, var(--violet-500) 60%, var(--violet-300) 100%);
      -webkit-background-clip: text; background-clip: text;
      color: transparent;
      letter-spacing: 2px; margin-bottom: 12px;
      filter: drop-shadow(0 2px 16px rgba(59,130,246,0.15));
    }

    .tagline { font-size: 14px; color: var(--text-muted); letter-spacing: 0.5px; margin-bottom: 52px; }

    .nav-grid {
      display: flex; flex-wrap: wrap; justify-content: center; gap: 12px;
      max-width: 600px;
    }
    .nav-pill {
      padding: 13px 32px;
      background: var(--surface);
      border: 1px solid rgba(147,197,253,0.35);
      border-radius: 999px;
      text-decoration: none; color: var(--text-primary);
      font-size: 14px; font-weight: 700;
      backdrop-filter: blur(12px);
      transition: all 0.22s cubic-bezier(.2,.8,.2,1);
      position: relative; overflow: hidden;
    }
    .nav-pill::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(147,197,253,0.15) 0%, rgba(196,181,253,0.15) 100%);
      opacity: 0; transition: opacity 0.22s;
    }
    .nav-pill:hover {
      transform: translateY(-3px);
      border-color: var(--ice-400);
      box-shadow: 0 12px 32px rgba(13,127,245,0.12), 0 0 0 1px rgba(147,197,253,0.3);
      background: rgba(255,255,255,0.9);
    }
    .nav-pill:hover::before { opacity: 1; }

    .crystal {
      position: fixed; pointer-events: none; z-index: 0; opacity: 0.07;
      animation: float 6s ease-in-out infinite;
    }
    .crystal:nth-child(1) { top: 10%; right: 8%;  font-size: 80px; animation-delay: 0s; }
    .crystal:nth-child(2) { bottom: 15%; left: 6%; font-size: 60px; animation-delay: 2s; }
    .crystal:nth-child(3) { top: 55%; right: 15%; font-size: 40px; animation-delay: 4s; }
    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50%       { transform: translateY(-12px) rotate(5deg); }
    }

    @media (max-width: 640px) {
      .stage { padding: 40px 20px; }
      .avatar { width: 88px; height: 88px; }
      .tagline { margin-bottom: 36px; }
      .nav-pill { padding: 11px 24px; font-size: 13px; }
    }
  </style>
</head>
<body>
  <div class="stars">
    <div class="star"></div><div class="star"></div><div class="star"></div>
    <div class="star"></div><div class="star"></div>
  </div>
  <div class="crystal">❄</div>
  <div class="crystal">✦</div>
  <div class="crystal">◈</div>

  <main class="stage">
    <div class="avatar-wrap">
      <img src="/assets/img/avatar.jpg" class="avatar" alt="Cori">
      <div class="avatar-ring"></div>
    </div>

    <h1 class="name">Cori</h1>
    <p class="tagline">伴你同行，让记忆有根，思想有文</p>

    <nav class="nav-grid">
      <a href="/blog"     class="nav-pill">博客</a>
      <a href="/book/"    class="nav-pill">书库</a>
      <a href="/models/"  class="nav-pill">模型</a>
      <a href="/reading/" class="nav-pill">阅读</a>
      <a href="/forum/"   class="nav-pill">论坛</a>
    </nav>
  </main>
</body>
</html>
