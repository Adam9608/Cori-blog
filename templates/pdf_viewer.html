<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ filename }} | Cori</title>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --ice-50: #f0f7ff; --ice-200: #b9dcff; --ice-400: #3a9eff; --ice-500: #0d7ff5; --ice-600: #0060cc;
      --text-primary: #0f172a; --text-secondary: #475569; --text-muted: #94a3b8;
      --border: rgba(148,163,184,0.2);
      --font: 'Zen Kaku Gothic New', -apple-system, sans-serif;
    }
    html, body { height: 100%; overflow: hidden; font-family: var(--font); color: var(--text-primary); background: #1a1a2e; }

    .topbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      height: 48px;
      display: flex; align-items: center; gap: 10px; padding: 0 16px;
      background: rgba(248,250,255,0.95);
      backdrop-filter: blur(20px) saturate(1.4);
      border-bottom: 1px solid var(--border);
    }
    .back {
      font-size: 13px; font-weight: 700; color: var(--text-secondary);
      text-decoration: none; padding: 6px 14px; border-radius: 999px;
      border: 1px solid transparent; transition: all .2s; white-space: nowrap; flex-shrink: 0;
    }
    .back:hover { background: var(--ice-50); color: var(--ice-600); border-color: var(--ice-200); }
    .title {
      font-size: 13px; font-weight: 700; color: var(--text-primary);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0;
    }

    .viewer { position: fixed; top: 48px; left: 0; right: 0; bottom: 0; }
    iframe { width: 100%; height: 100%; border: none; display: block; }

    /* 无法内嵌时的提示 */
    .unsupported {
      display: none; position: absolute; inset: 0;
      flex-direction: column; align-items: center; justify-content: center; gap: 16px;
      background: #f8faff; color: var(--text-secondary); text-align: center; padding: 32px;
    }
    .unsupported p { font-size: 15px; line-height: 1.7; max-width: 320px; }
    .unsupported a {
      display: inline-block; padding: 12px 32px;
      background: linear-gradient(135deg, var(--ice-500), #8b5cf6);
      color: #fff; text-decoration: none; border-radius: 999px;
      font-size: 14px; font-weight: 700;
    }

    @media (max-width: 640px) { .title { display: none; } }
  </style>
</head>
<body>
  <div class="topbar">
    <a href="/book/" class="back">← 书库</a>
    <span class="title">{{ filename }}</span>
  </div>

  <div class="viewer">
    <iframe id="pdfFrame" title="{{ filename }}"></iframe>
    <div class="unsupported" id="unsupported">
      <p>您的浏览器不支持在线预览此文件。<br>请尝试用其他浏览器打开，或在电脑端阅读。</p>
      <a href="/book/{{ filename }}" target="_blank">在新标签页打开</a>
    </div>
  </div>

  <script>
    const filename  = {{ filename | tojson }};
    const publicUrl = 'https://openclaw.cori.tokyo/book/' + encodeURIComponent(filename);
    const localUrl  = '/book/' + encodeURIComponent(filename);
    const gdocsUrl  = 'https://docs.google.com/viewer?url=' + encodeURIComponent(publicUrl) + '&embedded=true';

    const ua        = navigator.userAgent;
    const isAndroid = /Android/i.test(ua);
    const isWindows = /Windows/i.test(ua);
    const isIOS     = /iPhone|iPad|iPod/i.test(ua);

    const frame = document.getElementById('pdfFrame');

    if (isAndroid || isWindows) {
      // Android / Windows 浏览器 iframe 内嵌 PDF 兼容性差，用 Google Docs 在线预览
      frame.src = gdocsUrl;
    } else {
      // macOS / Linux / iOS Safari 直接内嵌
      frame.src = localUrl;
    }

    // Google Docs 偶尔加载失败时给提示
    frame.onerror = function () {
      document.getElementById('unsupported').style.display = 'flex';
      frame.style.display = 'none';
    };
  </script>
</body>
</html>
