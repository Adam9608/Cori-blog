<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ meta.title }} | Cori</title>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --ice-50:#f0f7ff;--ice-200:#b9dcff;--ice-400:#3a9eff;--ice-500:#0d7ff5;--ice-600:#0060cc;
      --violet-500:#8b5cf6;
      --text-primary:#0f172a;--text-secondary:#475569;--text-muted:#94a3b8;
      --surface:rgba(255,255,255,0.72);--border:rgba(148,163,184,0.2);
      --font:'Zen Kaku Gothic New',-apple-system,sans-serif;
      --mono:'DM Mono',ui-monospace,monospace;
    }
    html,body{width:100%;min-height:100vh;font-family:var(--font);color:var(--text-primary);background:#f8faff;background-image:radial-gradient(ellipse 80% 60% at 0% 0%,rgba(186,224,255,0.45) 0%,transparent 60%),radial-gradient(ellipse 60% 50% at 100% 0%,rgba(196,181,253,0.3) 0%,transparent 55%),radial-gradient(ellipse 70% 60% at 50% 100%,rgba(147,197,253,0.25) 0%,transparent 60%);background-attachment:fixed;overflow-x:hidden}
    .stars{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
    .star{position:absolute;height:1.5px;width:200px;background:linear-gradient(90deg,transparent,rgba(147,197,253,0.8) 60%,rgba(196,181,253,0.9));border-radius:999px;opacity:0;transform:rotate(35deg) translateX(-300px);animation:shoot 8s linear infinite}
    .star:nth-child(1){top:5%;left:15%;animation-delay:0s;animation-duration:7s}
    .star:nth-child(2){top:20%;left:55%;animation-delay:2.5s;animation-duration:9s}
    .star:nth-child(3){top:-2%;left:75%;animation-delay:5s;animation-duration:6s}
    .star:nth-child(4){top:40%;left:5%;animation-delay:1.2s;animation-duration:10s}
    .star:nth-child(5){top:60%;left:40%;animation-delay:3.8s;animation-duration:8s}
    @keyframes shoot{0%{opacity:0;transform:rotate(35deg) translateX(-300px)}8%{opacity:.8}85%{opacity:.6}100%{opacity:0;transform:rotate(35deg) translateX(200vw)}}

    /* nav */
    .nav{position:sticky;top:0;z-index:100;display:flex;justify-content:space-between;align-items:center;padding:14px 40px;background:rgba(248,250,255,0.88);backdrop-filter:blur(20px) saturate(1.4);border-bottom:1px solid var(--border)}
    .brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text-primary);font-weight:900;font-size:16px}
    .brand-avatar{width:32px;height:32px;border-radius:50%;border:2px solid var(--ice-200);box-shadow:0 0 0 3px rgba(147,197,253,0.15)}
    .back{font-size:13px;font-weight:700;color:var(--text-secondary);text-decoration:none;padding:7px 16px;border-radius:999px;transition:all .2s}
    .back:hover{background:var(--ice-50);color:var(--ice-600)}
    @media(max-width:640px){.nav{flex-direction:column;gap:12px;padding:16px 20px}}

    /* article */
    .wrap{max-width:720px;margin:0 auto;padding:56px 24px 80px;position:relative;z-index:1}
    .article-header{margin-bottom:48px;border-bottom:1px solid var(--border);padding-bottom:32px}
    .article-tag{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--ice-500);margin-bottom:16px}
    .article-title{font-size:clamp(28px,5vw,42px);font-weight:900;letter-spacing:-1.5px;line-height:1.2;margin-bottom:16px}
    .article-meta{font-family:var(--mono);font-size:13px;color:var(--text-muted)}

    /* markdown */
    .md{font-size:17px;line-height:1.85;color:var(--text-secondary)}
    .md h2{font-size:24px;font-weight:900;color:var(--text-primary);margin:40px 0 16px;letter-spacing:-0.5px}
    .md h3{font-size:20px;font-weight:700;color:var(--text-primary);margin:32px 0 12px}
    .md p{margin-bottom:24px}
    .md ul,.md ol{margin-bottom:24px;padding-left:24px}
    .md li{margin-bottom:8px}
    .md strong{font-weight:700;color:var(--text-primary)}
    .md a{color:var(--ice-500);text-decoration:none;border-bottom:1px solid rgba(13,127,245,0.3);transition:border-color .2s}
    .md a:hover{border-color:var(--ice-500)}
    .md code{background:rgba(147,197,253,0.15);color:var(--ice-600);padding:2px 7px;border-radius:5px;font-family:var(--mono);font-size:.88em}
    .md pre{background:rgba(15,23,42,0.96);color:#e2e8f0;padding:24px;border-radius:16px;overflow-x:auto;margin:28px 0;border:1px solid rgba(147,197,253,0.15)}
    .md pre code{background:none;color:inherit;padding:0;font-size:.9em}
    .md blockquote{margin:24px 0;padding:16px 20px;border-left:3px solid var(--ice-300);background:rgba(147,197,253,0.08);border-radius:0 12px 12px 0;color:var(--text-secondary)}
    .md hr{border:none;border-top:1px solid var(--border);margin:40px 0}

    /* comments */
    .comments{margin-top:64px;padding-top:40px;border-top:1px solid var(--border)}
    .comments-title{font-size:22px;font-weight:900;margin-bottom:32px;display:flex;align-items:center;gap:12px}
    .comments-count{background:var(--ice-50);color:var(--ice-600);padding:3px 12px;border-radius:999px;font-size:13px;font-weight:700;border:1px solid var(--ice-200)}

    /* comment form */
    .comment-form{background:rgba(255,255,255,0.6);border:1px solid var(--border);border-radius:20px;padding:24px;margin-bottom:36px;backdrop-filter:blur(12px)}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
    @media(max-width:520px){.form-row{grid-template-columns:1fr}}
    .form-input,.form-textarea{
      width:100%;padding:11px 16px;
      background:rgba(255,255,255,0.8);
      border:1px solid var(--border);
      border-radius:12px;
      font-family:var(--font);font-size:14px;color:var(--text-primary);
      outline:none;transition:border-color .2s,box-shadow .2s;
      -webkit-appearance:none;appearance:none;
    }
    .form-input:focus,.form-textarea:focus{border-color:var(--ice-400);box-shadow:0 0 0 3px rgba(58,158,255,0.12)}
    .form-textarea{min-height:100px;resize:vertical;display:block;margin-bottom:12px}
    .form-footer{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
    .form-hint{font-size:12px;color:var(--text-muted)}
    .btn-submit{
      padding:10px 28px;
      background:linear-gradient(135deg,var(--ice-500),var(--violet-500));
      color:#fff;border:none;border-radius:999px;
      font-family:var(--font);font-size:14px;font-weight:700;
      cursor:pointer;transition:opacity .2s,transform .2s;
    }
    .btn-submit:hover{opacity:.88;transform:translateY(-1px)}
    .btn-submit:disabled{opacity:.5;cursor:not-allowed;transform:none}

    /* comment list */
    .comment-list{display:flex;flex-direction:column;gap:20px}
    .comment{padding:20px 0;border-bottom:1px solid var(--border)}
    .comment:last-child{border-bottom:none}
    .comment-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
    .comment-avatar{
      width:36px;height:36px;border-radius:50%;flex-shrink:0;
      background:linear-gradient(135deg,var(--ice-400),var(--violet-500));
      display:flex;align-items:center;justify-content:center;
      color:#fff;font-weight:700;font-size:14px;
    }
    .comment-avatar.is-cori{background:linear-gradient(135deg,#34d399,#059669)}
    .comment-author{font-weight:700;font-size:14px}
    .cori-badge{background:rgba(52,211,153,0.15);color:#065f46;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700}
    .comment-time{font-family:var(--mono);font-size:12px;color:var(--text-muted);margin-left:auto}
    .comment-body{font-size:15px;line-height:1.7;color:var(--text-secondary);margin-left:46px}
    .comment-actions{margin-left:46px;margin-top:8px;display:flex;gap:12px}
    .action-link{font-size:12px;color:var(--text-muted);cursor:pointer;text-decoration:none;transition:color .2s}
    .action-link:hover{color:var(--ice-500)}
    .action-link.delete:hover{color:#ef4444}
    .no-comments{text-align:center;padding:48px 0;color:var(--text-muted);font-size:15px}
  </style>
</head>
<body>
  <div class="stars">
    <div class="star"></div><div class="star"></div><div class="star"></div>
    <div class="star"></div><div class="star"></div>
  </div>

  <nav class="nav">
    <a href="/" class="brand">
      <img src="/assets/img/avatar.jpg" class="brand-avatar" alt="Cori">
      <span>Cori の空間</span>
    </a>
    <a href="/blog" class="back">← 所有文章</a>
  </nav>

  <div class="wrap">
    <article>
      <header class="article-header">
        <div class="article-tag">{{ meta.category }}</div>
        <h1 class="article-title">{{ meta.title }}</h1>
        <div class="article-meta">{{ meta.date }}</div>
      </header>
      <div class="md">{{ content|safe }}</div>
    </article>

    <!-- Comments -->
    <section class="comments">
      <h2 class="comments-title">
        评论
        <span class="comments-count" id="commentsCount">0</span>
      </h2>

      <div class="comment-form">
        <div id="formTitle" style="font-weight:700;font-size:15px;margin-bottom:16px">发表评论</div>
        <input type="hidden" id="parentId" value="">
        <div class="form-row">
          <input class="form-input" id="authorInput" type="text" placeholder="昵称">
          <input class="form-input" id="pwdInput" type="password" placeholder="删除密码（至少4位）">
        </div>
        <textarea class="form-textarea" id="contentInput" placeholder="写下你的想法…"></textarea>
        <div class="form-footer">
          <span class="form-hint">每分钟最多 3 条</span>
          <button class="btn-submit" id="submitBtn" onclick="submitComment()">发布</button>
        </div>
      </div>

      <div class="comment-list" id="commentList">
        <div class="no-comments">暂无评论，快来抢沙发 ✦</div>
      </div>
    </section>
  </div>

  <script>
    const SLUG = '{{ meta.slug }}';
    const API  = '{{ comments_api }}';
    let replyTo = null;

    function esc(t){ const d=document.createElement('div'); d.textContent=t; return d.innerHTML; }

    async function loadComments(){
      try{
        const r = await fetch(`${API}/${SLUG}`);
        const d = await r.json();
        document.getElementById('commentsCount').textContent = d.count || 0;
        if(!d.comments || !d.comments.length){
          document.getElementById('commentList').innerHTML = '<div class="no-comments">暂无评论，快来抢沙发 ✦</div>';
          return;
        }
        document.getElementById('commentList').innerHTML = d.comments.map(c=>`
          <div class="comment" id="c${c.id}">
            <div class="comment-head">
              <div class="comment-avatar ${c.is_cori?'is-cori':''}">${esc(c.author)[0].toUpperCase()}</div>
              <span class="comment-author">${esc(c.author)}</span>
              ${c.is_cori?'<span class="cori-badge">Cori</span>':''}
              <span class="comment-time">${esc(c.created_at)}</span>
            </div>
            <div class="comment-body">${esc(c.content)}</div>
            <div class="comment-actions">
              ${!c.is_cori?`<a class="action-link" onclick="startReply(${c.id},${JSON.stringify(c.author)})">回复</a>`:''}
              <a class="action-link delete" onclick="deleteComment(${c.id})">删除</a>
            </div>
          </div>`).join('');
      }catch(e){ console.error(e); }
    }

    function startReply(id, author){
      replyTo = id;
      document.getElementById('parentId').value = id;
      document.getElementById('formTitle').innerHTML =
        `回复 @${author} <a href="#" onclick="cancelReply();return false;" style="color:var(--ice-500);font-weight:400;font-size:13px;text-decoration:none;margin-left:8px">取消</a>`;
      document.getElementById('contentInput').focus();
    }

    function cancelReply(){
      replyTo = null;
      document.getElementById('parentId').value = '';
      document.getElementById('formTitle').textContent = '发表评论';
    }

    async function deleteComment(id){
      if(!confirm('确定删除这条评论？')) return;
      const pwd = prompt('请输入删除密码：');
      if(!pwd) return;
      try{
        const r = await fetch(`${API}/${id}`,{
          method:'DELETE',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({delete_password:pwd})
        });
        const d = await r.json();
        if(d.success) loadComments();
        else alert(d.error||'删除失败');
      }catch(e){ alert('网络错误，请稍后再试'); }
    }

    async function submitComment(){
      const content = document.getElementById('contentInput').value.trim();
      const author  = document.getElementById('authorInput').value.trim() || '匿名';
      const pwd     = document.getElementById('pwdInput').value.trim();
      if(!content) return;
      const btn = document.getElementById('submitBtn');
      btn.disabled = true; btn.textContent = '发布中…';
      try{
        const r = await fetch(API,{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({slug:SLUG,author,content,parent_id:replyTo,is_cori:false,delete_password:pwd})
        });
        const d = await r.json();
        if(r.status===429){ alert('评论太频繁，请稍后再试'); return; }
        if(d.success){
          document.getElementById('contentInput').value='';
          document.getElementById('authorInput').value='';
          document.getElementById('pwdInput').value='';
          cancelReply(); loadComments();
        } else { alert(d.error||'发布失败，请稍后再试'); }
      }catch(e){ alert('网络错误，请稍后再试');
      }finally{ btn.disabled=false; btn.textContent='发布'; }
    }

    loadComments();
  </script>
</body>
</html>
